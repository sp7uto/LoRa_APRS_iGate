name: Publish iGate Wiki
on:
  push:
    branches: [feature/wifi-network-management]
    paths:
      - 'docs/wifi-network-management/wiki/**'
      - '.github/workflows/publish-wiki.yml'
      - 'tools/render_wifi_docs.py'
      - 'docs/config-generator/**'
      - 'tests/config_generator.test.cjs'
      - 'tests/config_generator_browser.py'
      - 'tools/add_cover_to_docs.py'
      - 'data_embed/index.html'
      - 'data_embed/script.js'
      - 'data_embed/style.css'
      - 'data_embed/bootstrap.css'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: igate-wiki-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Insert approved cover when available
        if: hashFiles('docs/wifi-network-management/wiki/images/sp7uto/igate-cover.jpg') != ''
        shell: bash
        env:
          REPOSITORY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/add_cover_to_docs.py
          git add -- README.md docs/wifi-network-management/README.md docs/wifi-network-management/wiki/Home.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: place approved iGate cover in README and Wiki"
            git push "https://x-access-token:${REPOSITORY_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/feature/wifi-network-management
          fi
      - name: Test configuration generator
        run: node tests/config_generator.test.cjs
      - name: Upload offline configuration generator
        uses: actions/upload-artifact@v4
        with:
          name: igate-config-generator
          path: docs/config-generator/index.html
          if-no-files-found: error
      - name: Validate bilingual source pages
        shell: bash
        run: |
          set -euo pipefail
          src=docs/wifi-network-management/wiki
          for page in Home Configuration Configuration-Generator Hardware Installation Network-Failover APRS-IS Backup-and-Restore Testing Troubleshooting Changelog Roadmap _Sidebar _Footer; do
            test -s "$src/$page.md"
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Render Wi-Fi configuration images from firmware source
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
          python tests/config_generator_browser.py
          python tools/render_wifi_docs.py --output docs/wifi-network-management/wiki/images/sp7uto
      - name: Upload generated configuration images
        uses: actions/upload-artifact@v4
        with:
          name: wifi-configuration-screenshots
          path: docs/wifi-network-management/wiki/images/sp7uto/ap-*.png
          if-no-files-found: error
      - name: Synchronize Wiki without deleting unrelated pages
        shell: bash
        env:
          REPOSITORY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${REPOSITORY_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          if ! git ls-remote "$url" HEAD >/dev/null 2>&1; then
            echo "::error::Wiki repository unavailable to the repository token. Check Wiki initialization and Actions write permissions."
            exit 1
          fi
          git clone --quiet "$url" "$RUNNER_TEMP/wiki-live"
          cd "$RUNNER_TEMP/wiki-live"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # These thirteen pages were already adopted manually as this project's
          # versioned Wiki. Preserve existing Git history and all unrelated pages.
          for page in Home Configuration Configuration-Generator Hardware Installation Network-Failover APRS-IS Backup-and-Restore Testing Troubleshooting Changelog Roadmap _Sidebar _Footer; do
            cp "$GITHUB_WORKSPACE/docs/wifi-network-management/wiki/$page.md" "$page.md"
            git add -- "$page.md"
          done
          # Copy only the project's image directories; never remove other Wiki assets.
          for folder in ca2rxu sp7uto; do
            mkdir -p "images/$folder"
            cp -a "$GITHUB_WORKSPACE/docs/wifi-network-management/wiki/images/$folder/." "images/$folder/"
            git add -- "images/$folder"
          done
          cp "$GITHUB_WORKSPACE/docs/wifi-network-management/wiki/images/ATTRIBUTION.md" images/ATTRIBUTION.md
          git add -- images/ATTRIBUTION.md
          if git diff --cached --quiet; then
            echo "Wiki already up to date"
            exit 0
          fi
          git commit -m "docs: sync bilingual iGate Wiki from ${GITHUB_SHA:0:12}"
          git push origin HEAD
          echo "Wiki synchronization complete"
