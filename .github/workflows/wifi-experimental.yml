name: Experimental Wi-Fi CI
on:
  push:
    branches:
      - feature/wifi-network-management
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: IPv4 host tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/wifi_ipv4_validation.cpp -o /tmp/wifi-ipv4-test
          /tmp/wifi-ipv4-test
      - name: JavaScript syntax
        run: node --check data_embed/script.js
  build:
    runs-on: ubuntu-latest
    needs: validation
    strategy:
      fail-fast: false
      matrix:
        target: [heltec_wifi_lora_32_V3, ttgo-lora32-v21, wiznet_5500_evb_pico2_e22p]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install platformio
      - run: pio run -e ${{ matrix.target }}
      - name: Upload experimental Heltec OTA binary
        if: matrix.target == 'heltec_wifi_lora_32_V3'
        uses: actions/upload-artifact@v4
        with:
          name: heltec-v3-experimental-ota
          path: .pio/build/heltec_wifi_lora_32_V3/firmware.bin
          if-no-files-found: error
